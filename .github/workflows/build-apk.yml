name: Build production APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Gate (UI audit, analyze, tests)
        run: bash tool/check.sh

      - name: Require signing secrets
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret for $v. A production APK must be signed with your own key."
              exit 1
            fi
          done

      - name: Create release keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build release APKs
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols
          --build-number=${{ github.run_number }}

      - name: Verify the APKs (signed with your key, no internet permission)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            echo "== $f"
            "$APKSIGNER" verify --print-certs "$f" | tee /tmp/certs.txt
            if grep -qi "Android Debug" /tmp/certs.txt; then
              echo "::error::$f is signed with the debug key"
              exit 1
            fi
            if "$AAPT2" dump permissions "$f" | grep -q "android.permission.INTERNET"; then
              echo "::error::$f requests the INTERNET permission"
              exit 1
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug symbols (for de-obfuscating crash traces)
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-symbols
          path: build/symbols
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
